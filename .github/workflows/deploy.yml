name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ardan-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER || '"ubuntu-latest"') }}
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: python -m pip install 'ansible-core==2.19.3'
      - name: Prepare private SSH and Ansible inputs
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ENV: ${{ secrets.ARDAN_ENV }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          os.umask(0o077)
          work = Path(os.environ['RUNNER_TEMP']) / 'ardan-deploy'
          work.mkdir(exist_ok=True)
          for name in ('DEPLOY_SSH_KEY', 'DEPLOY_KNOWN_HOSTS', 'DEPLOY_ENV', 'DEPLOY_HOST'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required configuration: {name}')
          for name, env in [('id', 'DEPLOY_SSH_KEY'), ('known_hosts', 'DEPLOY_KNOWN_HOSTS'), ('ardan.env', 'DEPLOY_ENV')]:
              (work / name).write_text(os.environ[env] + '\n')
          inventory = {'all': {'children': {'ardan': {'hosts': {'deploy': {
              'ansible_host': os.environ['DEPLOY_HOST'],
              'ansible_user': os.environ['DEPLOY_USER'],
              'ansible_port': int(os.environ['DEPLOY_PORT']),
              'ansible_ssh_private_key_file': str(work / 'id'),
              'ansible_ssh_common_args': f'-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile={work / "known_hosts"}',
          }}}}}}
          (work / 'inventory.json').write_text(json.dumps(inventory))
          (work / 'vars.json').write_text(json.dumps({
              'ardan_version': os.environ['DEPLOY_VERSION'],
              'ardan_env_source': str(work / 'ardan.env'),
          }))
          PY
      - name: Deploy checked revision with Ansible
        run: >-
          ansible-playbook -i "$RUNNER_TEMP/ardan-deploy/inventory.json"
          ansible/deploy.yml -e "@$RUNNER_TEMP/ardan-deploy/vars.json"
      - name: Remove private deployment inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ardan-deploy"
