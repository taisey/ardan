name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ardan-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER || '"ubuntu-latest"') }}
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: python -m pip install 'ansible-core==2.19.3'
      - name: Install cloudflared for Access SSH
        if: vars.VM_USE_CLOUDFLARE_ACCESS == 'true'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/ardan-deploy/bin"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$arch" \
            --output "$RUNNER_TEMP/ardan-deploy/bin/cloudflared"
          chmod 700 "$RUNNER_TEMP/ardan-deploy/bin/cloudflared"
          echo "$RUNNER_TEMP/ardan-deploy/bin" >> "$GITHUB_PATH"
      - name: Prepare private SSH and Ansible inputs
        env:
          VM_SSH_PASSWORD: ${{ secrets.VM_SSH_PASSWORD }}
          VM_BECOME_PASSWORD: ${{ secrets.VM_BECOME_PASSWORD }}
          DEPLOY_ENV: ${{ secrets.ARDAN_ENV }}
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT || '22' }}
          DEPLOY_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
          VM_USE_CLOUDFLARE_ACCESS: ${{ vars.VM_USE_CLOUDFLARE_ACCESS || 'false' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os, shlex
          from pathlib import Path
          os.umask(0o077)
          work = Path(os.environ['RUNNER_TEMP']) / 'ardan-deploy'
          work.mkdir(exist_ok=True)
          for name in ('VM_SSH_PASSWORD', 'DEPLOY_ENV', 'VM_HOST'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required configuration: {name}')
          use_access = os.environ['VM_USE_CLOUDFLARE_ACCESS']
          if use_access not in ('true', 'false'):
              raise SystemExit('VM_USE_CLOUDFLARE_ACCESS must be true or false')
          ssh_args = '-o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null'
          if use_access == 'true':
              for name in ('CF_ACCESS_CLIENT_ID', 'CF_ACCESS_CLIENT_SECRET'):
                  if not os.environ.get(name):
                      raise SystemExit(f'Missing required configuration: {name}')
              proxy = work / 'access-ssh'
              proxy.write_text(
                  '#!/bin/sh\n'
                  'exec cloudflared access ssh --hostname "$1" '
                  '--service-token-id "$CF_ACCESS_CLIENT_ID" '
                  '--service-token-secret "$CF_ACCESS_CLIENT_SECRET"\n'
              )
              proxy.chmod(0o700)
              ssh_args += ' -o ProxyCommand=' + shlex.quote(shlex.join([str(proxy), '%h']))
          (work / 'ardan.env').write_text(os.environ['DEPLOY_ENV'] + '\n')
          inventory = {'all': {'children': {'ardan': {'hosts': {'deploy': {
              'ansible_host': os.environ['VM_HOST'],
              'ansible_user': os.environ['VM_USER'],
              'ansible_port': int(os.environ['VM_SSH_PORT']),
              'ansible_password': os.environ['VM_SSH_PASSWORD'],
              'ansible_become_password': os.environ.get('VM_BECOME_PASSWORD') or os.environ['VM_SSH_PASSWORD'],
              'ansible_ssh_password_mechanism': 'ssh_askpass',
              'ansible_ssh_common_args': ssh_args,
          }}}}}}
          (work / 'inventory.json').write_text(json.dumps(inventory))
          (work / 'vars.json').write_text(json.dumps({
              'ardan_version': os.environ['DEPLOY_VERSION'],
              'ardan_env_source': str(work / 'ardan.env'),
          }))
          PY
      - name: Deploy checked revision with Ansible
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          ansible-playbook -i "$RUNNER_TEMP/ardan-deploy/inventory.json"
          ansible/deploy.yml -e "@$RUNNER_TEMP/ardan-deploy/vars.json"
      - name: Remove private deployment inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ardan-deploy"
